name: Edith CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edith-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LILITH_EXECUTION_MODE: simulation
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: Python ${{ matrix.python-version }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Run test suite
        run: python -m pytest -q

  notebook-validation:
    name: Notebook validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install notebook tooling
        run: python -m pip install --upgrade pip nbformat json-repair

      - name: Repair, normalize, and sanitize notebook copy
        run: python scripts/sanitize_notebook.py

      - name: Validate notebook JSON and cell structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import nbformat

          notebooks = sorted(Path('.').glob('*.ipynb'))
          if Path('notebooks').exists():
              notebooks += sorted(Path('notebooks').glob('*.ipynb'))
          if not notebooks:
              raise SystemExit('No notebooks found to validate')

          for notebook_path in notebooks:
              notebook = nbformat.read(notebook_path, as_version=4)
              nbformat.validate(notebook)
              print(f'validated: {notebook_path}')
          PY

      - name: Check sanitized notebook for obvious credentials
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --include='*.ipynb' '(MT5_PASSWORD\s*[=:]|password\s*[=:]\s*["'"'][^"'"']+["'"']|login\s*[=:]\s*[0-9]{5,})' .; then
            echo 'Potential credential found in notebook content.'
            exit 1
          fi

  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@v3.88.35
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified
