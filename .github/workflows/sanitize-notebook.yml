name: Sanitize committed notebook

on:
  push:
    branches: [main]
    paths:
      - 'edith.ipynb'
      - 'scripts/sanitize_notebook.py'
      - '.github/workflows/sanitize-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sanitize:
    if: ${{ !contains(github.event.head_commit.message, '[skip sanitize]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install notebook tooling
        run: python -m pip install --upgrade pip nbformat json-repair

      - name: Repair, normalize, and sanitize notebook
        run: python scripts/sanitize_notebook.py

      - name: Validate repaired notebook
        run: |
          python - <<'PY'
          import nbformat
          notebook = nbformat.read('edith.ipynb', as_version=4)
          nbformat.validate(notebook)
          print('validated: edith.ipynb')
          PY

      - name: Open notebook repair pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/repair-edith-notebook
          delete-branch: true
          commit-message: 'security: repair notebook JSON, externalize MT5 credentials, and clear outputs [skip sanitize]'
          title: 'Repair and sanitize Edith notebook'
          body: |
            Automated notebook repair generated by the repository sanitizer.

            - repairs malformed notebook JSON
            - normalizes notebook metadata
            - clears saved outputs and execution counts
            - externalizes MT5 credentials
            - preserves trading source cells
          labels: automation,security
          add-paths: |
            edith.ipynb
