[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilith-edith"
version = "0.1.0"
description = "Governed forensic and execution-intelligence components for Edith"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = [
    "json-repair>=0.30,<1",
    "nbformat>=5.10,<6",
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<7",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
