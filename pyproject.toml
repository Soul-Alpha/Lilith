[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilith-edith"
version = "0.1.0"
description = "Governed forensic and execution-intelligence components for Edith"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]
mt5 = ["MetaTrader5>=5.0.45"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
